dataset:
  id: ee616_predecessor_target_v1
  root: work/ros2_ws/datasets/ee616_predecessor_target_v1
  annotation_format: Ultralytics YOLO normalized xywh
  annotation_policy: >-
    Project the complete known target box and clip it to the image. Use an
    empty label when the target is fully outside the image. In the held-out
    occlusion scene, the label retains the full target extent behind the
    foreground occluder.
  split_rule: Scenario-level split; no scene appears in more than one split.
  train_scenes: [yolo_train_open, yolo_train_aisle]
  validation_scenes: [yolo_val_mixed]
  test_scenes: [yolo_test_occlusion]
  final_gate_scenes: [camera_calibration, straight_aisle]
  final_gate_policy: >-
    The A012 final-gate scenes and exact range-bearing matrix are excluded from
    training, validation, and dataset test images.
  capture_ranges_m: [1.2, 1.8, 2.4, 3.2, 4.2, 5.2]
  capture_bearings_deg: [-48.0, -28.0, -18.0, -8.0, 0.0, 8.0, 18.0, 28.0, 48.0]
  frames_per_condition: 3
  expected_images:
    train: 324
    val: 162
    test: 162
    total: 648
  capture_result:
    dataset_sha256: 1049c1491947995b3439d482c6f2bcc86425d52d31d05cc9b43ba92be9e6579a
    train_images: 324
    validation_images: 162
    test_images: 162
    note: >-
      Three frames were retained per static condition to expose capture
      repeatability. Exact duplicate frames are possible and are reported as
      unique-image counts in the dataset manifest.

ground_truth_boundary:
  allowed: >-
    The ee616_evaluation dataset recorder may use Gazebo poses to place the
    target and generate offline labels.
  forbidden: >-
    Gazebo poses and generated labels must not enter ee616_perception,
    estimation, supervision, or control.

acceptance_criteria:
  full_visible_valid_rate_min: 0.95
  range_rmse_m_max: 0.15
  bearing_mae_deg_max: 1.5
  detector_latency_p95_ms_max: 66.7
  required_resource_logs: [cpu, ram, gpu, vram]
  required_error_logs: [false_positive, false_negative]
