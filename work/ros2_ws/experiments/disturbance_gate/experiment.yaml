schema_version: 1
experiment_id: a020_controlled_disturbance_gate
status: passed
scope: >-
  Controlled simulated sharp turns, full-frame camera blackouts, stopped-leader
  behavior, and a bounded post-controller yaw-command bias. This is not physical
  occlusion, wheel-slip, physical-robot, person-safety, or production evidence.
architecture:
  leader: deterministic bounded velocity route
  topology: predecessor_following
  follower_inputs: [forward_rgb_camera, local_wheel_odometry]
  detector: yolov8n_predecessor_v3
  estimator: relative_range_bearing_ekf
  supervisor_states: [TRACK, PREDICT, SAFE_STOP]
  robot_namespaces: [/leader, /follower_1, /follower_2, /follower_3]
  ground_truth: evaluation_only
startup:
  stationary_initialization_s: 8.0
  reason: >-
    A first repeated matrix exposed a detector-startup race before leader motion.
    The stationary window was increased from 4 to 8 seconds and every disturbance
    was shifted by the same amount. Acceptance limits were not changed.
staging:
  - stage: pair
    follower_count: 1
    run_count: 15
    required_before_next_stage: true
    status: passed
  - stage: combined_chain
    follower_count: 3
    run_count: 3
    required_before_next_stage: true
    status: passed
matrix:
  pair_scenarios: [sharp_turn, short_occlusion, long_occlusion, leader_stop, actuator_bias]
  pair_repetitions_per_scenario: 3
  chain_scenario: combined
  chain_repetitions: 3
  total_runs: 18
  desired_range_m: 1.5
disturbances:
  sharp_turn_angular_rps: 0.18
  short_camera_blackout_s: 0.5
  long_camera_blackout_s: 1.3
  stopped_leader_s: 4.0
  actuator_yaw_bias_rps: 0.15
  actuator_bias_duration_s: 0.5
  targeted_chain_follower: 2
acceptance:
  follower_1_spacing_rmse_m_max: 0.30
  later_follower_spacing_rmse_m_max: 0.35
  collision_samples_max: 0
  track_fraction_min: 0.85
  control_period_p95_ms_max: 66.7
  bounded_linear_mps: [0.0, 0.6]
  bounded_angular_rps: [-0.8, 0.8]
  short_occlusion_reacquisition_s_max: 0.70
  long_safe_stop_latency_s_max: 1.10
  long_occlusion_reacquisition_s_max: 0.70
  actuator_spacing_recovery_s_max: 3.0
  peak_gpu_memory_mib_max: 4096
