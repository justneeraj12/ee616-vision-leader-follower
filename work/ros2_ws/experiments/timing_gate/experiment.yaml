schema_version: 1
experiment_id: gate_6_target_laptop_timing
status: completed_pass
scope: >-
  Three repeated runs of the accepted three-follower combined Gate 5 scenario,
  with evaluation-only observer timing and container/GPU resource sampling on the
  target laptop. No controller, detector, route, or disturbance behavior changes.
architecture:
  scenario: combined
  follower_count: 3
  detector: yolov8n_predecessor_v3
  estimator: relative_range_bearing_ekf
  supervisor_states: [TRACK, PREDICT, SAFE_STOP]
  robot_namespaces: [/leader, /follower_1, /follower_2, /follower_3]
  ground_truth: evaluation_only_behavior_evaluator
matrix:
  repetitions: 3
  duration_s_per_timing_observer: 49.0
  stationary_initialization_s: 8.0
timing_metrics:
  - camera_to_measurement_observer_wall_time
  - valid_measurement_to_next_controller_command_observer_wall_time
  - controller_command_to_post_proxy_command_observer_wall_time
  - detector_reported_inference_time
  - control_period
  - camera_and_measurement_rates
  - measurement_delivery_ratio
  - simulation_real_time_factor
resource_metrics:
  interval_s: 0.25
  fields: [cpu_core_equivalent_percent, container_memory_mib, gpu_utilization_percent, gpu_memory_mib]
acceptance:
  camera_to_measurement_p95_ms_max: 66.7
  measurement_to_controller_command_p95_ms_max: 66.7
  controller_to_actual_command_p95_ms_max: 50.0
  detector_inference_p95_ms_max: 66.7
  control_period_p95_ms_max: 66.7
  measurement_delivery_ratio_min: 0.95
  simulation_real_time_factor_min: 0.90
  peak_gpu_memory_mib_max: 4096
  peak_container_memory_mib_max: 12288
  accepted_gate_5_behavior_must_pass: true
limitations:
  - Observer latency uses one-host wall-clock callback arrival times.
  - Measurements do not include network transport or physical actuator response.
  - Resource samples are container-level except NVIDIA utilization and memory.
execution:
  completed_utc: 2026-09-30
  repetitions_completed: 3
  aggregate_status: pass
  ros_package_tests: 59
  real_time_factor_min: 0.9996201314281385
  peak_container_memory_mib: 3583.9921875
  peak_gpu_memory_mib: 642.0
  peak_gpu_utilization_percent: 60.0
  cpu_core_equivalent_percent: 443.1331762631285
  evidence_directory: work/ros2_ws/results/timing_gate
