name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toy-baseline:
    name: Toy baseline on Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: work/toy_simulation

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: work/toy_simulation/pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Run deterministic baseline smoke test
        run: python -m toy_swarm.run --output "${RUNNER_TEMP}/toy-results"

      - name: Verify required evidence files
        run: |
          test -s results/summary.json
          test -s warehouse_results/warehouse_multi_summary.json
          test -s warehouse_results/warehouse_multi_timeseries.csv
